<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JM Task Manager</title>
    <link rel="stylesheet" href="tmd.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 JM Task Manager</h1>
            <p class="subtitle">Drag and drop tasks to organize your workflow</p>
        </header>

        <div class="task-form">
            <input type="text" id="taskInput" placeholder="Enter a new task..." maxlength="100">
            <button id="addTaskBtn">Add Task</button>
        </div>

        <div class="kanban-board">
            <div class="column" id="todo">
                <div class="column-header">
                    <h2>📝 To Do</h2>
                    <span class="task-count" id="todo-count">0</span>
                </div>
                <div class="task-list" data-status="todo">
                </div>
            </div>

            <div class="column" id="inprogress">
                <div class="column-header">
                    <h2>🔄 In Progress</h2>
                    <span class="task-count" id="inprogress-count">0</span>
                </div>
                <div class="task-list" data-status="inprogress">
                </div>
            </div>

            <div class="column" id="done">
                <div class="column-header">
                    <h2>✅ Done</h2>
                    <span class="task-count" id="done-count">0</span>
                </div>
                <div class="task-list" data-status="done">
                </div>
            </div>
        </div>

        <div class="clear-container">
            <button id="clearAllBtn" class="clear-btn">Clear All Tasks</button>
        </div>
    </div>

    <script src="tmd.js"></script>
</body>
</html>
